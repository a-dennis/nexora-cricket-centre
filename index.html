<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>KCL (KPD Cricket League) | Live scores</title>
<meta name="description" content="Live ball-by-ball scoreboard">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0f24;--card:#141b3f;--line:#2c3a7a;--mut:#9fb0d8;--g:#1fe0a0;--b:#12a3d8;--p:#7a5cff;--r:#ff5470;--a:#ffc857}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:radial-gradient(520px 380px at 90% -5%,#1fe0a044,transparent),radial-gradient(440px 400px at -10% 25%,#6a4dff44,transparent),var(--bg);background-attachment:fixed;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 90px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);letter-spacing:.4px;gap:8px}
.top b{color:#fff;font-size:14px}
.demo{background:#ffb02033;color:var(--a);border:1px solid #ffb02088;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:1px;white-space:nowrap}
h1{font-size:13px;color:#b9c6ee;font-weight:600;margin:16px 0 8px}
h2{font-size:20px;margin:14px 0 4px}
.card{background:linear-gradient(160deg,#1a2350,#121a3d);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:0 12px 30px #0008;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.team{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;min-width:0}
.team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex:none}
.l0{background:linear-gradient(135deg,#1fe0a0,#12a3d8);color:#06222b}.l1{background:linear-gradient(135deg,#ff8a3d,#ff3d77);color:#2a0a14}
.score{font-size:38px;font-weight:900;letter-spacing:-1px;white-space:nowrap}.score small{font-size:15px;color:var(--mut);font-weight:600;letter-spacing:0}
.sub{color:var(--mut);font-size:12px;margin-top:2px}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--r);font-weight:800;font-size:12px;letter-spacing:1.5px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--r);box-shadow:0 0 10px var(--r);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.chip{display:inline-block;padding:7px 11px;border-radius:12px;background:#ffffff12;font-size:12px;font-weight:700;margin:0 5px 5px 0;white-space:nowrap}
.green{color:var(--g)}.amber{color:var(--a)}.red{color:var(--r)}
.balls{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.ball{min-width:34px;height:34px;padding:0 6px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:#ffffff14;border:1px solid #ffffff22}
.b4{background:var(--b);border-color:var(--b)}.b6{background:var(--p);border-color:var(--p)}.bw{background:#ff3d5e;border-color:#ff3d5e}.bx{background:#ffc85733;border-color:#ffc857aa;color:var(--a)}.b0{color:#8a98c4}.bn{opacity:.3}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:8px 3px;text-align:right}.tbl td:first-child,.tbl th:first-child{text-align:left}.tbl th{color:#7f90c4;font-size:11px;font-weight:600}.tbl tr+tr td{border-top:1px solid #ffffff10}
.tabs{display:flex;gap:6px;margin:14px 0 4px;background:#ffffff0d;padding:4px;border-radius:14px}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font-weight:700;font-size:13px;padding:9px;border-radius:11px;cursor:pointer}
.tabs button.on{background:#ffffff1c;color:#fff}
.btn{display:flex;align-items:center;justify-content:center;border:0;border-radius:16px;font-weight:900;font-size:20px;height:58px;color:#fff;cursor:pointer;font-family:inherit;width:100%}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.45}
.g0{background:#ffffff14}.g1{background:#ffffff1c}.g4{background:linear-gradient(135deg,#12a3d8,#1fe0a0);color:#06222b}.g6{background:linear-gradient(135deg,#7a5cff,#c05cff)}.gw{background:linear-gradient(135deg,#ff3d5e,#ff8a3d)}
.gx{background:#ffffff0d;font-size:13px;border:1px dashed #ffffff30;height:46px}.gx.on{background:#ffc85733;border:1px solid var(--a);color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.span2{grid-column:span 2}
.pri{background:var(--g);color:#05221b;font-size:16px;height:50px}
.sec{background:#ffffff14;font-size:14px;height:44px}
.small{height:40px;font-size:12px;font-weight:700;background:#ffffff12;border-radius:12px}
.foot{text-align:center;font-size:11px;color:#8a98c4;margin-top:20px}.foot b{color:#fff}
input,select,textarea{width:100%;background:#0d1330;border:1px solid var(--line);color:#fff;border-radius:12px;padding:11px 12px;font:inherit;font-size:15px}
textarea{min-height:130px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;border-radius:8px;background:#ffffff14;overflow:hidden;margin-top:8px}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--b))}
.sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:#10173a;border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:520px;padding:18px 16px 26px;max-height:85vh;overflow:auto}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-top:8px;border-radius:14px;background:#ffffff12;border:0;color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.opt:active{background:#ffffff26}.opt.on{background:var(--g);color:#05221b}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.pills .opt{width:auto;margin:0;padding:10px 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#ff3d5e;color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;max-width:90vw;text-align:center}
.toast.ok{background:var(--g);color:#05221b}
.res{background:linear-gradient(135deg,#1fe0a033,#12a3d833);border:1px solid var(--g);border-radius:18px;padding:14px 16px;font-weight:800;text-align:center;margin-bottom:12px}
.link{word-break:break-all;font-size:13px;background:#0d1330;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 8px;color:var(--g)}
.warn{background:#ffb02022;border:1px solid #ffb02066;color:var(--a);border-radius:14px;padding:10px 12px;font-size:13px;margin:8px 0}
.stale{color:var(--a)}
.mut{color:var(--mut);font-size:13px}
a{color:var(--g)}


.trow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff12;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:11px;color:#8fa2d6;font-weight:800;padding:4px 0}
.day{position:relative;aspect-ratio:1;border:0;border-radius:12px;background:#ffffff0a;color:#c9d4f5;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.day.has{background:#1fe0a022;color:#fff;box-shadow:inset 0 0 0 1px #1fe0a066}
.day.today{box-shadow:inset 0 0 0 2px var(--a)}
.day.sel{background:linear-gradient(135deg,var(--g),var(--b));color:#05221b}
.day i{position:absolute;right:4px;top:3px;font-size:9px;font-style:normal;background:#05221b;color:var(--g);border-radius:8px;padding:1px 5px}
.day.sel i{background:#05221b;color:#fff}
.nav{width:42px;height:42px;border-radius:14px;border:0;background:#ffffff14;color:#fff;font-size:24px;cursor:pointer}
.mc{display:block;text-decoration:none;color:#fff;background:linear-gradient(160deg,#1c2756,#111838);border:1px solid #34448f;border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 8px 20px #0007}
.mc .row{margin-bottom:4px}.mc b{font-size:15px}
.badge{font-size:10px;font-weight:800;letter-spacing:1px;background:#1fe0a022;color:var(--g);border:1px solid #1fe0a066;border-radius:20px;padding:3px 9px}.badge.dim{background:#ffffff10;color:var(--mut);border-color:#ffffff22}
/* polish */
body{background:radial-gradient(560px 420px at 95% -8%,#1fe0a050,transparent),radial-gradient(500px 460px at -15% 18%,#6a4dff50,transparent),radial-gradient(420px 300px at 60% 105%,#12a3d833,transparent),var(--bg);background-attachment:fixed}
.wrap{animation:rise .35s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.top{padding:2px 0 6px}
.brand{display:inline-flex;align-items:center;gap:9px;font-size:15px;letter-spacing:.2px}
.mark{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,#1fe0a0,#12a3d8);position:relative;display:inline-block;box-shadow:0 4px 14px #1fe0a055}
.mark:after{content:"";position:absolute;left:7px;top:7px;width:12px;height:12px;border-radius:50%;background:#06222b;box-shadow:inset -3px -3px 0 #ff3d5e}
.hero{margin:18px 0 6px}.hero h2{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.6px;background:linear-gradient(90deg,#fff,#a8ffe0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:14px;margin-top:8px}
h1{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#8fa2d6;font-weight:800;margin:20px 0 8px}
.card{background:linear-gradient(160deg,#1c2756,#111838);border:1px solid #34448f;box-shadow:0 14px 34px #0009,inset 0 1px 0 #ffffff14;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--g),var(--b),var(--p));opacity:.85}
.score{font-size:52px;line-height:1;letter-spacing:-2px;text-shadow:0 4px 24px #1fe0a044}.score small{font-size:20px}
.logo{width:46px;height:46px;border-radius:15px;font-size:16px;box-shadow:0 6px 16px #0006}
.team{font-size:19px}
.tabs{position:sticky;top:0;z-index:5;backdrop-filter:blur(12px);background:#0f1636d0;border:1px solid #ffffff14;margin:12px 0 8px}
.tabs button{transition:background .15s}.tabs button.on{background:linear-gradient(135deg,#1fe0a033,#12a3d833);box-shadow:inset 0 0 0 1px #1fe0a066}
.ball{box-shadow:0 3px 8px #0005;transition:transform .15s}.ball:last-child{transform:scale(1.04)}
.btn{box-shadow:0 6px 14px #0006,inset 0 1px 0 #ffffff1f;transition:transform .08s,filter .15s}.btn:hover{filter:brightness(1.1)}
.pri{box-shadow:0 8px 22px #1fe0a055}
.gw{font-size:22px;letter-spacing:1.5px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ffc857;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#6f81b8}
input:focus,select:focus,textarea:focus{border-color:var(--g)}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid #ffffff12;font-size:12px}

/* match centre */
.mh{margin:6px 0 2px}.mh h2{font-size:22px;margin:6px 0 2px;letter-spacing:-.3px;background:none;-webkit-text-fill-color:#fff;color:#fff}
.stp{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1.2px;padding:4px 10px;border-radius:20px;background:#ffffff14;color:var(--mut);border:1px solid #ffffff22;white-space:nowrap}
.stp.lv{background:#ff547022;color:#ff8a9c;border-color:#ff547088}.stp.lv i{width:7px;height:7px;border-radius:50%;background:var(--r);animation:pulse 1.4s infinite}
.stp.fin{background:#1fe0a022;color:var(--g);border-color:#1fe0a077}
.stick{position:sticky;top:0;z-index:6;margin:10px -16px 8px;padding:8px 16px 0;background:#0a0f24f2;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff18}
.mini{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 0 8px}
.mt{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);min-width:0}.mt b{color:#fff;font-size:15px}.mt small{font-size:11px}.mt.on b{color:var(--g)}
.vs{font-size:10px;color:#6f81b8;text-transform:uppercase}
.lg{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;font-size:10px;font-style:normal;font-weight:900;flex:none}
.stick .tabs{position:static;margin:0;padding:0;background:none;border:0;border-radius:0;backdrop-filter:none;gap:0}
.stick .tabs button{border-radius:0;padding:11px 4px;font-size:12.5px;border-bottom:3px solid transparent;background:none!important;box-shadow:none!important}
.stick .tabs button.on{color:#fff;border-bottom-color:var(--g)}
.hero2{padding:8px 18px 14px}.trw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff12}.trw.dim{opacity:.62}
.trw .score{font-size:36px;text-align:right}.trw .score .ov{font-size:11px;color:var(--mut);letter-spacing:0;font-weight:600;margin-top:2px}
.yet{color:var(--mut);font-size:13px}.bt{font-size:10px;font-style:normal;color:var(--g);border:1px solid #1fe0a077;border-radius:10px;padding:1px 7px;margin-left:6px;font-weight:700;vertical-align:middle}
.stl{margin-top:12px;font-size:14px;color:#dbe4ff}.stl.win{color:var(--g);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-top:12px}.stats div{background:#ffffff0d;border-radius:12px;padding:8px 10px}.stats small{display:block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}.stats b{font-size:17px}
.star{color:var(--g);font-weight:900;margin-left:2px}.note2{font-size:12.5px;color:var(--mut);padding:2px 0 12px}.note2 b{color:#fff}
.balls.tight{gap:5px}.balls.tight .ball{min-width:30px;height:30px;font-size:12px}
.cm{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #ffffff12}.cm:last-child{border-bottom:0}
.cn{min-width:38px;height:26px;border-radius:13px;background:#ffffff14;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.ct{font-size:14px;line-height:1.35;min-width:0}.ct .sub{font-size:11.5px;margin-top:3px}
.cm.c4 .cn{background:var(--b)}.cm.c6 .cn{background:var(--p)}.cm.cw .cn{background:#ff3d5e}.cm.cw{background:#ff3d5e12;margin:0 -14px;padding-left:14px;padding-right:14px}
.cout{color:#ff8a9c;font-weight:800;margin-top:3px}
.eo{margin:4px -14px;padding:8px 14px;background:#ffffff0d;font-size:12px;font-weight:700;color:#b9c6ee;border-top:1px solid #ffffff12}
.mc{border-left:4px solid #34448f}.mc.liv{border-left-color:var(--r)}.mc.don{border-left-color:var(--g)}
.mtop{margin-bottom:8px;font-size:12px}.mrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:15px}.mrow .team{font-size:15px;gap:9px}

/* desktop / laptop layout */
@media(min-width:900px){

    var chipH=function(arr){return arr.map(function(t){var cl=/^\d*W$/.test(t)?'bw2':t==='4'?'b4':t==='6'?'b6':/Wd|Nb|B$|Lb$/.test(t)?'bx':'';return '<span class="b '+cl+'">'+E(t==='0'?'·':t)+'</span>'}).join('')};

function downloadReport(){
  if(!S)return;
  var name=(S.config.title||'Match').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+(S.config.date?'-'+S.config.date:'')+'.html';
  var blob=new Blob([buildReport(S)],{type:'text/html'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);toast('Report downloaded',1);
}
document.addEventListener('click',function(e){if(e.target&&e.target.id==='dlrep')downloadReport();if(e.target&&e.target.id==='dlbk')dlBackup('/api/matches/'+id+'/backup',{'x-scorer-key':key},'match-backup-'+id);if(e.target&&e.target.id==='dltb'){var o=tList().filter(function(t){return t.id===id})[0];if(o)dlBackup('/api/tournaments/'+id+'/backup',{'x-org-key':o.key},'tournament-backup-'+id)}});
function dlBackup(url,hd,nm){
  fetch(url,{headers:hd}).then(function(r){return r.json().then(function(j){if(!r.ok){toast(j.error||'Could not download');return}
    var b=new Blob([JSON.stringify(j,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nm+'-'+todayStr()+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);toast('Backup downloaded',1)})},function(){toast('Network problem. Try again.')});
}

function tList(){try{return JSON.parse(localStorage.getItem('ct_list')||'[]').filter(function(t){return t&&t.id&&t.key})}catch(e){return[]}}
function refreshNames(){
  ['ct_list','ct_view'].forEach(function(store){
    var raw;try{raw=JSON.parse(localStorage.getItem(store)||'[]')}catch(e){return}
    if(!Array.isArray(raw))return;
    raw.forEach(function(t){if(!t||!t.id)return;
      fetch('/api/tournaments/'+encodeURIComponent(t.id)).then(function(r){return r.ok?r.json():null}).then(function(j){
        if(!j||!j.name||j.name===t.name)return;
        try{var cur=JSON.parse(localStorage.getItem(store)||'[]');cur.forEach(function(x){if(x&&x.id===t.id)x.name=j.name});localStorage.setItem(store,JSON.stringify(cur))}catch(e){}
        Array.prototype.forEach.call(document.querySelectorAll('.trow'),function(r){var l=r.querySelector('a');if(l&&l.getAttribute('href')==='/t/'+t.id){var b=r.querySelector('b');if(b)b.textContent=j.name}});
        Array.prototype.forEach.call(document.querySelectorAll('#tsel option'),function(o){if(o.value===t.id)o.textContent=j.name});
      }).catch(function(){})});
  });
}

  S.state.innings.forEach(function(i){
    var all=i.overHistory.slice();
    if(i.thisOver.length)all.push({n:i.curOverNo,bowler:i.bowler!==null?i.players.bowl[i.bowler]:'',balls:i.thisOver,runs:null});
    if(!all.length)return;
    h+='<h1>'+esc(i.batName)+' innings</h1>'+all.slice().reverse().map(function(o){return '<div class="card" style="padding:12px 16px"><div class="row"><b>Over '+o.n+'</b><span class="sub">'+esc(o.bowler)+(o.runs!==null?' · '+o.runs+' runs':'')+'</span></div><div class="balls">'+chips(o.balls)+'</div></div>'}).join('');
  });
  return h||'<div class="mut" style="margin-top:14px">No balls bowled yet.</div>';
}
function tabsHtml(){return '<div class="stick">'+mini()+'<div class="tabs">'+[['live','Live'],['card','Scorecard'],['comm','Commentary'],['overs','Overs']].map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div></div>'}
function viewerBody(){return tab==='live'?liveTab():tab==='card'?scorecardTab():tab==='comm'?commentaryTab():oversTab()}

function render(){
  if(!S){app.innerHTML=(err?'<div class="warn" style="margin-top:30px">'+esc(err)+'</div>':'<div class="mut" style="margin-top:40px;text-align:center">Loading match...<br>The free server may take up to a minute to wake up.</div>')+FOOT;return}
  var h=head()+tabsHtml()+'<div class="dsk '+(mode==='s'?'sc':'vw')+'"><div class="dl">'+viewerBody()+(mode==='s'?'</div><div class="dr">':'');
  if(mode==='s')h+=scorerPanel()+attachCard()+'<div class="card"><button class="btn sec" id="dlrep">Download match report</button><button class="btn sec" id="dlbk" style="margin-top:10px">Download match backup (file)</button><div class="mut" style="font-size:12.5px;margin-top:8px">The report is a printable match card. The backup file holds every ball and can restore this match later. It never contains your scorer link.</div></div>';
  else{h+='<div class="card" style="margin-top:6px"><button class="btn sec" id="share">Share this live scoreboard</button><button class="btn sec" id="dlrep" style="margin-top:10px">Download match report</button></div>'}
  h+='</div></div>'+FOOT;app.innerHTML=h;tickLabel();wire();
  if(mode==='s')openNeeds();
}
function wire(){
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){b.onclick=function(){tab=b.getAttribute('data-t');render()}});
  var sh=document.getElementById('share');
  if(sh)sh.onclick=function(){var u=location.origin+'/m/'+id;if(navigator.share)navigator.share({title:S.config.title,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){toast('Link copied',1)})};
}

/* ---------- SCORER ---------- */
function scorerPanel(){
  if(!key)return '<div class="warn" style="margin-top:14px">This is a view-only link. Open the scorer link you were given to enter scores.</div>';
  var st=S.state,i=cur();
  if(st.result)return '<div class="card"><div class="mut">Match finished. Use Undo if the last ball was a mistake.</div><div class="grid" style="grid-template-columns:1fr 1fr"><button class="btn small" id="undo">↶ Undo</button><button class="btn small" id="newm">New match</button></div></div>';
  var dis=busy||st.needs.length?' disabled':'';
  var h='<h1>Scorer pad · '+esc(i.batName)+' batting</h1><div class="card" style="padding:12px 14px">';
  h+='<div class="sub" style="margin-bottom:8px">'+(extra?'Adding: <b class="amber">'+({wd:'Wide',nb:'No ball',b:'Byes',lb:'Leg byes'})[extra]+'</b> · tap runs (0 = none)':'')+'</div>';
  h+='<div class="grid" style="margin-top:0">';
  [0,1,2,3].forEach(function(n){h+='<button class="btn '+(n?'g1':'g0')+'" data-r="'+n+'"'+dis+'>'+n+'</button>'});
  h+='<button class="btn g4" data-r="4"'+dis+'>4</button><button class="btn g6" data-r="6"'+dis+'>6</button><button class="btn gw span2" id="wk"'+dis+'>WICKET</button>';
  [['wd','Wide'],['nb','No ball'],['b','Bye'],['lb','Leg bye']].forEach(function(e){h+='<button class="btn gx'+(extra===e[0]?' on':'')+'" data-x="'+e[0]+'"'+dis+'>'+e[1]+'</button>'});
  h+='</div><div class="grid" style="grid-template-columns:repeat(4,1fr)"><button class="btn small" data-r="5"'+dis+'>5 runs</button><button class="btn small" data-r="7"'+dis+'>7 runs</button><button class="btn small" id="undo"'+(busy?' disabled':'')+'>↶ Undo</button><button class="btn small" id="swap"'+dis+'>End innings</button></div></div>';
  return h;
}
function post(url,body){
  if(busy)return;busy=true;render0();
  api('POST','/api/matches/'+id+url,Object.assign({rev:S.rev},body||{})).then(function(r){
    busy=false;
    if(r.ok){S=r.j;lastOk=Date.now();extra='';sheet=null;}
    else{if(r.j.match){S=r.j.match;}toast(r.j.error||'Failed')}
    render();
  }).catch(function(){busy=false;toast('No connection. Not saved - try again.');render()});
}
function render0(){var b=document.querySelectorAll('.btn');Array.prototype.forEach.call(b,function(x){x.disabled=true})}
document.addEventListener('click',function(e){
  if(mode!=='s'||!S||!key)return;
  var t=e.target.closest('button');if(!t)return;
  var r=t.getAttribute('data-r'),x=t.getAttribute('data-x');
  if(r!==null&&!t.closest('.sheet')){post('/event',{event:{t:'ball',r:+r,x:extra}});return}
  if(x){extra=extra===x?'':x;render();return}
  if(t.id==='undo'){post('/undo');return}
  if(t.id==='wk'){openWicket();return}
  if(t.id==='swap'){if(confirm('End this innings now? (For example, time ran out.)'))post('/event',{event:{t:'end'}});return}
  if(t.id==='newm'){location.href='/'}
});
function openSheet(html){closeSheet();var d=document.createElement('div');d.className='sheet';d.id='sheet';d.innerHTML='<div>'+html+'</div>';document.body.appendChild(d);return d}
function closeSheet(){var s=document.getElementById('sheet');if(s)s.remove()}
var needKey='';
function openNeeds(){
  var st=S.state;if(st.result||!st.needs.length||!key){closeSheet();needKey='';return}
  var role=st.needs[0],i=cur(),k=role+':'+st.lastBall;
  if(needKey===k&&document.getElementById('sheet'))return;needKey=k;
  var title={striker:'Who is on strike?',non:'Who is the non-striker?',newbat:'New batter in',bowler:'Who is bowling the next over?'}[role];
  var list;
  if(role==='bowler'){list=i.players.bowl.map(function(n,p){return{p:p,name:n}}).filter(function(o){return o.p!==i.lastBowler});
    if(S.config.maxOversPerBowler)list=list.filter(function(o){var b=i.bowling.filter(function(x){return x.p===o.p})[0];return !b||parseFloat(b.overs)<S.config.maxOversPerBowler})}
  else list=i.yetToBat;
  var d=openSheet('<h2 style="margin-top:0">'+esc(title)+'</h2><div class="mut">'+(st.cur===1&&!i.balls&&role==='striker'?'Second innings: '+esc(i.batName)+' need '+i.target+' to win. ':'')+(role==='bowler'?esc(i.bowlName):esc(i.batName))+'</div>'+list.map(function(o){return '<button class="opt" data-p="'+o.p+'">'+esc(o.name)+'</button>'}).join('')+(list.length?'':'<div class="warn">No eligible player. Use Undo, or change the over limit rule.</div><button class="opt" id="sundo">↶ Undo last ball</button>'));
  d.onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='sundo'){post('/undo');return}var p=b.getAttribute('data-p');if(p!==null)post('/event',{event:{t:'sel',role:role,player:+p}})};
}
function openWicket(){
  var i=cur(),kinds=[['bowled','Bowled'],['caught','Caught'],['lbw','LBW'],['stumped','Stumped'],['runout','Run out'],['hitwicket','Hit wicket'],['other','Other']];
  var w={k:'bowled',who:'s',r:0,f:''};
  var strN=i.players.bat[i.striker],nonN=i.players.bat[i.non];
  var d=openSheet('');
  function draw(){
    var fielders=i.players.bowl;
    d.firstChild.innerHTML='<h2 style="margin-top:0">Wicket</h2><div class="mut">'+(extra?'On a '+({wd:'wide',nb:'no ball',b:'bye',lb:'leg bye'})[extra]+'. ':'')+'How was the batter out?</div>'+
    '<div class="pills">'+kinds.map(function(k){return '<button class="opt'+(w.k===k[0]?' on':'')+'" data-k="'+k[0]+'">'+k[1]+'</button>'}).join('')+'</div>'+
    '<h1>Who is out?</h1><div class="pills"><button class="opt'+(w.who==='s'?' on':'')+'" data-w="s">'+esc(strN)+' (striker)</button><button class="opt'+(w.who==='n'?' on':'')+'" data-w="n"'+(w.k==='runout'?'':' disabled style="opacity:.35"')+'>'+esc(nonN)+'</button></div>'+
    (w.k==='runout'?'<h1>Runs completed before the run out</h1><div class="pills">'+[0,1,2,3].map(function(n){return '<button class="opt'+(w.r===n?' on':'')+'" data-n="'+n+'">'+n+'</button>'}).join('')+'</div>':'')+
    (['caught','stumped','runout'].indexOf(w.k)>=0?'<h1>Fielder (optional)</h1><div class="pills"><button class="opt'+(!w.f?' on':'')+'" data-f="">Skip</button>'+fielders.map(function(n){return '<button class="opt'+(w.f===n?' on':'')+'" data-f="'+esc(n)+'">'+esc(n)+'</button>'}).join('')+'</div>':'')+
    '<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px"><button class="btn sec" data-c="1">Cancel</button><button class="btn gw" data-ok="1" style="font-size:16px">Confirm wicket</button></div>';
  }
  draw();
  d.onclick=function(e){
    if(e.target===d){closeSheet();return}
    var b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.k){w.k=b.dataset.k;if(w.k!=='runout'){w.who='s';w.r=0}draw()}
    else if(b.dataset.w){w.who=b.dataset.w;draw()}
    else if(b.dataset.n!==undefined){w.r=+b.dataset.n;draw()}
    else if(b.dataset.f!==undefined){w.f=b.dataset.f;draw()}
    else if(b.dataset.c)closeSheet();
    else if(b.dataset.ok){closeSheet();post('/event',{event:{t:'ball',r:w.r,x:extra,w:{k:w.k,who:w.who,f:w.f}}})}
  };
}

/* ---------- boot ---------- */
if(mode==='home')home();
else if(mode==='t'){
  var om=location.hash.match(/o=([A-Za-z0-9]+)/);
  if(om){history.replaceState(null,'',location.pathname);fetch('/api/tournaments/'+id).then(function(r){return r.json()}).then(function(j){if(j&&j.name){tSave({id:id,name:j.name,key:om[1]});renderT()}})}
  renderT();loadT(true);setInterval(loadT,15000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)loadT()});
}
else{
  if(mode==='s'){
    var m=location.hash.match(/k=([A-Za-z0-9]+)/);
    try{if(m){localStorage.setItem('ck_'+id,m[1]);history.replaceState(null,'',location.pathname)}key=localStorage.getItem('ck_'+id)}catch(e){key=m?m[1]:null}
  }
  render();load(true);
  setInterval(load,3000);setInterval(tickLabel,1000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
}
})();
</script></body></html>
